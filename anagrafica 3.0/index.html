<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagrafica Generazionale</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
}

body {
  background: #e9f5f2;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px;
  gap: 40px;
  flex-wrap: wrap;
}

form {
  background: #ffffff;
  border-radius: 16px;
  padding: 40px 45px;
  width: 100%;
  max-width: 600px;
  border: 2px solid #dbe7e3;
  box-shadow: 0 4px 8px rgba(0,0,0,0.06);
  animation: slideDown 0.4s ease-out;
}

h1 {
  text-align: center;
  color: #2e4d45;
  font-size: 27px;
  margin-bottom: 25px;
  font-weight: 700;
}

label {
  display: block;
  font-weight: 600;
  color: #3b5c55;
  margin-bottom: 6px;
  margin-top: 16px;
  font-size: 15px;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #c6dcd7;
  background: #f9fdfc;
  font-size: 1rem;
  transition: 0.2s;
}

input:focus,
select:focus {
  border-color: #77c3a5;
  background: #ffffff;
  outline: none;
}

.radio-group,
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 8px;
}

.radio-group label,
.checkbox-group label {
  color: #2e4d45;
  font-weight: 500;
  cursor: pointer;
}


input[type="button"] {
  margin-top: 30px;
  width: 100%;
  padding: 14px;
  background: #77c3a5;
  color: white;
  font-size: 1.05rem;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.2s, background 0.25s;
  font-weight: 600;
}

input[type="button"]:hover {
  background: #5aa98c;
  transform: translateY(-2px);
}

#output {
  background: #ffffff;
  padding: 35px 40px;
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  color: #2e4d45;
  border: 2px solid #dbe7e3;
  box-shadow: 0 4px 8px rgba(0,0,0,0.06);
  animation: slideDown 0.5s ease-out;
}

#output h2 {
  text-align: center;
  margin-bottom: 15px;
  font-size: 22px;
  font-weight: 700;
  color: #3b5c55;
}

#output p {
  margin-bottom: 10px;
  line-height: 1.6;
  font-size: 15px;
  color: #466760;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>

</head>
<body>
  <form id="anagraficaForm">
    <h1>Anagrafica Generazionale</h1>

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>

    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" required>

    <label for="indirizzo">Indirizzo</label>
    <input type="text" id="indirizzo" name="indirizzo">

    <label for="citta">Città</label>
    <input type="text" id="citta" name="citta">

    <label for="cap">CAP</label>
    <input type="text" id="cap" name="cap">

    <label for="eta">Età</label>
    <input type="number" id="eta" name="eta" placeholder="Età attuale">

    <label for="dataNascita">Data di nascita</label>
    <input type="date" id="dataNascita" name="dataNascita">

    <label>Sesso</label>
    <div class="radio-group">
      <label><input type="radio" name="sesso" value="M"> M</label>
      <label><input type="radio" name="sesso" value="F"> F</label>
      <label><input type="radio" name="sesso" value="Altro"> Altro</label>
    </div>

    <label for="provincia">Provincia</label>
    <select id="provincia" name="provincia">
      <option value="">-- Seleziona la provincia --</option>
      <option>RM - Roma</option>
      <option>MI - Milano</option>
      <option>NA - Napoli</option>
      <option>TO - Torino</option>
      <option>FI - Firenze</option>
      <option>VE - Venezia</option>
      <option>BA - Bari</option>
    </select>

    <label>Mezzi di locomozione posseduti in famiglia</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="mezzi" value="Auto"> Auto</label>
      <label><input type="checkbox" name="mezzi" value="Moto"> Moto</label>
      <label><input type="checkbox" name="mezzi" value="Bici"> Bici</label>
      <label><input type="checkbox" name="mezzi" value="Aereo"> Aereo</label>
      <label><input type="checkbox" name="mezzi" value="Yacht"> Yacht</label>
    </div>

    <label for="materie">Materie di insegnamento preferite (max 3)</label>
    <select id="materie" name="materie" multiple>
      <option>Matematica</option>
      <option>Italiano</option>
      <option>Inglese</option>
      <option>Scienze</option>
      <option>Storia</option>
      <option>Geografia</option>
      <option>Arte</option>
      <option>Educazione fisica</option>
      <option>Musica</option>
    </select>

    <input type="button" value="Invia dati" onclick="stampa()">
  </form>

  <div id="output">
    <h2>Dati Inseriti</h2>
    <p>Compila il modulo e premi "Invia dati" per vedere il riepilogo qui.</p>
  </div>
<script src="script.js"></script>

</body>
</html>
