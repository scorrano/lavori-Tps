<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Lavori TPS</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #90caf9, #e3f2fd);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 380px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      color: #0d47a1;
      font-size: 28px;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    ul {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    li {
      margin: 18px 0;
    }

    a {
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: #0d47a1;
      transition: 0.25s;
      padding: 10px 0;
      display: inline-block;
      border-left: 4px solid transparent;
      padding-left: 10px;
    }

    a:hover {
      color: #1565c0;
      border-left: 4px solid #1565c0;
      transform: translateX(6px);
    }
  </style>
</head>

    </ul>
  </div>
</body>
</html>
