<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagrafica Generazionale</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Inter", sans-serif;
}

body {
  background: #f4f7fb;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 50px 20px;
  gap: 50px;
  flex-wrap: wrap;
}

form {
  background: white;
  border-radius: 14px;
  padding: 40px 45px;
  width: 100%;
  max-width: 620px;
  border: 1px solid #dce3ee;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  animation: fade 0.4s ease-out;
}

h1 {
  text-align: center;
  color: #2d3a55;
  font-size: 28px;
  margin-bottom: 20px;
  font-weight: 700;
}

label {
  display: block;
  font-weight: 600;
  color: #445270;
  margin-bottom: 6px;
  margin-top: 18px;
  font-size: 15px;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid #c6cfdd;
  background: #ffffff;
  transition: border 0.25s;
  font-size: 15px;
}

input:focus,
select:focus {
  outline: none;
  border-color: #4a74ff;
}

.radio-group,
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 5px;
}

.radio-group label,
.checkbox-group label {
  color: #2d3a55;
  font-weight: 500;
  cursor: pointer;
}

input[type="button"] {
  margin-top: 30px;
  width: 100%;
  padding: 14px;
  background: #4a74ff;
  color: white;
  font-size: 17px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.25s, transform 0.2s;
}

input[type="button"]:hover {
  background: #3759d8;
  transform: translateY(-2px);
}

#output {
  background: #ffffff;
  padding: 35px 40px;
  border-radius: 14px;
  max-width: 480px;
  width: 100%;
  color: #2d3a55;
  border: 1px solid #dce3ee;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  animation: fade 0.5s ease-out;
}

#output h2 {
  text-align: center;
  margin-bottom: 18px;
  font-size: 22px;
  font-weight: 700;
}

#output p {
  margin-bottom: 12px;
  line-height: 1.6;
  font-size: 15px;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>

</head>
<body>
  <form id="anagraficaForm">
    <h1>Anagrafica Generazionale</h1>

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>

    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" required>

    <label for="indirizzo">Indirizzo</label>
    <input type="text" id="indirizzo" name="indirizzo">

    <label for="citta">Città</label>
    <input type="text" id="citta" name="citta">

    <label for="cap">CAP</label>
    <input type="text" id="cap" name="cap">

    <label for="eta">Età</label>
    <input type="number" id="eta" name="eta" placeholder="Età attuale">

    <label for="dataNascita">Data di nascita</label>
    <input type="date" id="dataNascita" name="dataNascita">

    <label>Sesso</label>
    <div class="radio-group">
      <label><input type="radio" name="sesso" value="M"> M</label>
      <label><input type="radio" name="sesso" value="F"> F</label>
      <label><input type="radio" name="sesso" value="Altro"> Altro</label>
    </div>

    <label for="provincia">Provincia</label>
    <select id="provincia" name="provincia">
      <option value="">-- Seleziona la provincia --</option>
      <option>RM - Roma</option>
      <option>MI - Milano</option>
      <option>NA - Napoli</option>
      <option>TO - Torino</option>
      <option>FI - Firenze</option>
      <option>VE - Venezia</option>
      <option>BA - Bari</option>
    </select>

    <label>Mezzi di locomozione posseduti in famiglia</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="mezzi" value="Auto"> Auto</label>
      <label><input type="checkbox" name="mezzi" value="Moto"> Moto</label>
      <label><input type="checkbox" name="mezzi" value="Bici"> Bici</label>
      <label><input type="checkbox" name="mezzi" value="Aereo"> Aereo</label>
      <label><input type="checkbox" name="mezzi" value="Yacht"> Yacht</label>
    </div>

    <label for="materie">Materie di insegnamento preferite (max 3)</label>
    <select id="materie" name="materie" multiple>
      <option>Matematica</option>
      <option>Italiano</option>
      <option>Inglese</option>
      <option>Scienze</option>
      <option>Storia</option>
      <option>Geografia</option>
      <option>Arte</option>
      <option>Educazione fisica</option>
      <option>Musica</option>
    </select>

    <input type="button" value="Invia dati" onclick="stampa()">
  </form>

  <div id="output">
    <h2>Dati Inseriti</h2>
    <p>Compila il modulo e premi "Invia dati" per vedere il riepilogo qui.</p>
  </div>
<script src="script.js"></script>

</body>
</html>
